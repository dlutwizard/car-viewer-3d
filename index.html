<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#101113" />
  <title>3D 展厅</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="picking">
  <div id="app">
    <canvas id="scene"></canvas>

    <div class="picker" id="picker">
      <div class="picker-inner">
        <div class="picker-eyebrow">SELECT A CAR</div>
        <h2 class="picker-title">选择车辆</h2>
        <p class="picker-sub">选好后再加载 3D 模型</p>
        <div class="picker-grid" id="pickerGrid" role="group" aria-label="车辆选择"></div>
      </div>
    </div>

    <header class="hud-title">
      <div class="eyebrow">INTERACTIVE 3D</div>
      <h1 id="hudCarName">丰田 RAV4</h1>
    </header>

    <div class="hud-mark"><span id="hudMarkMain">RAV4</span><span>3D VIEWER</span></div>

    <div class="hint" id="hint">
      <svg viewBox="0 0 24 24"><path d="M9 11.5V6.5a1.4 1.4 0 0 1 2.8 0V11m0-1V5a1.4 1.4 0 0 1 2.8 0v6m0-4a1.4 1.4 0 0 1 2.8 0v6.5c0 4.4-2.8 7-6.6 7S7 17.8 7 13.5v-2a1.4 1.4 0 0 1 2.8 0v2"/></svg>
      <strong>拖拽旋转</strong>
      <span>滚轮缩放</span>
    </div>

    <nav class="toolbar" id="toolbar">
      <button class="tool" data-panel="views" data-tip="预设机位" aria-label="预设机位">
        <svg viewBox="0 0 24 24"><path d="M4.5 8.5h2.8l1.6-2.6h6.2l1.6 2.6h2.8A1.5 1.5 0 0 1 21 10v7.2a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.2V10a1.5 1.5 0 0 1 1.5-1.5Z"/><circle cx="12" cy="13.4" r="3.2"/></svg>
      </button>
      <button class="tool" data-panel="lighting" data-tip="灯光环境" aria-label="灯光环境">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M21.5 12h-2M4.5 12h-2M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4M18.7 18.7l-1.4-1.4M6.7 6.7 5.3 5.3"/></svg>
      </button>
      <button class="tool" data-panel="paint" data-tip="车漆颜色" aria-label="车漆颜色">
        <svg viewBox="0 0 24 24"><path d="M12 3.2c3.1 3.4 5.8 6.5 5.8 9.6a5.8 5.8 0 0 1-11.6 0c0-3.1 2.7-6.2 5.8-9.6Z"/><path d="M9.4 14.2a2.6 2.6 0 0 0 2.6 2.6"/></svg>
      </button>
      <button class="tool" data-panel="plate" data-tip="车牌号码" aria-label="车牌号码">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="7" width="17" height="10.4" rx="2.2"/><path d="M7.6 12.2h8.8M10.4 9.4h3.2"/></svg>
      </button>
      <button class="tool" id="btnRotate" data-tip="自动旋转" aria-label="自动旋转">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4.5V10h-5.5"/></svg>
      </button>
      <button class="tool" id="btnFullscreen" data-tip="全屏" aria-label="全屏">
        <svg viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg>
      </button>
    </nav>

    <nav class="car-switch" id="carSwitch" aria-label="选择车辆"></nav>

    <section class="panel" id="panel-views" hidden>
      <div class="panel-head">
        <span>预设机位</span>
        <button class="panel-close" aria-label="关闭">×</button>
      </div>
      <div class="view-grid" id="viewGrid"></div>
      <button class="reset-btn" id="btnReset">重置视角</button>
    </section>

    <section class="panel" id="panel-lighting" hidden>
      <div class="panel-head">
        <span>灯光环境</span>
        <button class="panel-close" aria-label="关闭">×</button>
      </div>
      <div class="light-grid" id="lightGrid"></div>
    </section>

    <section class="panel" id="panel-paint" hidden>
      <div class="panel-head">
        <span>车漆颜色</span>
        <button class="panel-close" aria-label="关闭">×</button>
      </div>
      <div class="paint-current"><i id="paintDot" style="background:#f0eee7"></i><span id="paintName">超级白</span></div>
      <div class="swatches" id="swatches"></div>
    </section>

    <section class="panel" id="panel-plate" hidden>
      <div class="panel-head">
        <span>车牌号码</span>
        <button class="panel-close" aria-label="关闭">×</button>
      </div>
      <div class="plate-editor">
        <div class="region-keys" id="plateRegion" role="group" aria-label="地区"></div>
        <div class="plate-input-row">
          <input id="plateInput" type="text" maxlength="6" value="A88888" spellcheck="false" autocomplete="off" />
          <button id="btnPlateApply" class="plate-apply">应用</button>
        </div>
        <p class="plate-msg" id="plateMsg">点选地区 + 1 个字母 + 5 位字母或数字。仅保存在你的浏览器。</p>
      </div>
    </section>

    <div class="loader" id="loader">
      <div class="loader-inner">
        <div class="loader-title" id="loaderTitle">丰田 RAV4</div>
        <div class="loader-bar"><i id="loaderBar"></i></div>
        <div class="loader-meta"><span id="loaderPct">0%</span><span>正在加载 3D 模型</span></div>
        <div class="loader-err" id="loaderErr" hidden></div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
